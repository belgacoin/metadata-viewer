name: Build

# Builds the Windows .exe (and a macOS .dmg) on GitHub's runners, so no
# Windows machine or Mac of your own is needed.
#
# - On a push to main (or manual run): artifacts appear under the run.
# - On a v* tag: the binaries are also attached to a GitHub Release, so
#   anyone can download and install them without digging through artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows .exe
        shell: pwsh
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-viewer-windows
          path: dist/*.exe
      - name: Upload .exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          brew install exiftool
          python -m pip install --upgrade pyinstaller pillow mutagen
      - name: Build macOS .dmg
        run: ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-viewer-macos
          path: dist/*.dmg
      - name: Verify deep_inspection.py is bundled
        run: |
          test -f "dist/Metadata Viewer.app/Contents/MacOS/deep_inspection.py"
      - name: Upload .dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
